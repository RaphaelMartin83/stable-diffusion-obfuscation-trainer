# ============================================================
# Feedback Loop Configuration
# ============================================================

# --- Stable Diffusion model -------------------------------------------
# HuggingFace model ID or absolute path to a local SD 1.x checkpoint.
# Examples:
#   "runwayml/stable-diffusion-v1-5"
#   "stabilityai/stable-diffusion-2-1"
#   "/path/to/local/sd-model"
sd_model_id: "runwayml/stable-diffusion-v1-5"

# --- Classifiers (same names as evaluate.py) --------------------------
models_dir: ../models/.models

# classifiers are used as the adversarial training signal (gradient flows through these)
classifiers:
  - resnet50
  - densenet121
  - cavia2024

# evaluator models are used only for measurement — no gradient, just counting detections
# defaults to 'classifiers' if omitted
evaluator:
  - resnet50
  - densenet121
  - vit_b_16
  - densenet121_dct
  - cavia2024

# number of images generated for each evaluation pass (pre- and post-training)
eval_iterations: 100

dct_log_scale: true

image_height: 512
image_width:  512
batch_size: 1                   # increase if VRAM allows
num_inference_steps: 20         # DDIM steps; 20 is fast, 50 is higher quality
guidance_scale: 7.5

# --- Training ---------------------------------------------------------
total_iterations: 500           # total feedback steps
learning_rate: 1.0e-6           # keep small to avoid destroying generative quality
grad_clip: 1.0                  # gradient norm clipping

# images don't just fool detectors but also look natural to a human.
# Set iqa_weight to 0 (or omit the block) to disable — no metric is loaded.
iqa_metric: clipiqa             # pyiqa metric name (clipiqa | musiq | maniqa | ...)
iqa_weight: 0.3                 # relative weight vs. detector loss (both roughly [0,1])

# --- Anti-drift distillation to a frozen reference UNet ---------------
# Keeps the trainable UNet's noise prediction close to the original SD
# prior (MSE on the raw noise pred at the final DDIM step). The single
# biggest fix for the "attack succeeds but images turn blurry" failure
# mode. Costs ~1× UNet in extra VRAM.
# Set distill_weight to 0 (or omit) to disable — no reference is loaded.
distill_weight: 1.0             # try 0.5–5.0; higher = more faithful to SD, less room to evade

# --- Generation settings ----------------------------------------------
# Single fixed positive/negative prompt pair (no rotation).
prompt: "RAW photo, a photorealistic portrait of a person, shot on a Sony A7R V with an 85mm f/1.4 lens, natural lighting, ultra-detailed skin texture and pores, sharp focus, high dynamic range, unedited DSLR photograph, 8k uhd, professional photography"
negative_prompt: "cartoon, illustration, painting, drawing, anime, 3d render, cgi, video game, plastic skin, airbrushed, smooth skin, waxy, deformed, disfigured, extra limbs, blurry, out of focus, low quality, low resolution, jpeg artifacts, grainy, oversaturated, black and white, sketch, digital art, watermark, text, logo, signature"

# --- Checkpointing & output -------------------------------------------
output_dir: feedback_output
save_every: 50                  # save UNet checkpoint every N steps
save_images_every: 25           # save sample decoded images every N steps

# --- Device -----------------------------------------------------------
device: auto                    # "auto" = CUDA if available, else CPU
